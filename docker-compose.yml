services:
  preview:
    build:
      context: .
      args:
        VERSION: ${APP_VERSION:-dev}
        REVISION: ${REVISION:-unknown}
    image: career-path:dev
    ports:
      - "${PORT:-8000}:8000"
    environment:
      HOST: 0.0.0.0
      PORT: 8000
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges"
    pids_limit: 128
    mem_limit: 128m
    cpus: 0.50
    stop_grace_period: 5s
    restart: unless-stopped
    volumes:
      - ./:/app:ro,Z
      - career-dist:/app/dist

volumes:
  career-dist:
